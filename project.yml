name: HelloWorld
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  HelloWorld:
    type: application
    platform: iOS
    sources: [HelloWorld]
    info:
      path: HelloWorld/Info.plist
      properties:
        CFBundleDisplayName: Hello World
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jjguve5.helloworld
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
